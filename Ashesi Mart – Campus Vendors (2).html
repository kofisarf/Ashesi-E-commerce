<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ashesi Mart – Campus Vendors</title>
<style>
:root{--side:#923d41;--red:#923d41;--redd:#743034;--bg:#fff;--surf:#fbf3f3;--tx:#2a1215;--mut:#7a5a5e;--bd:#ecd3d5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1c0e10;--surf:#2a1417;--tx:#fbeeee;--mut:#c9a3a8;--bd:#4a2429;--red:#d9626a;--redd:#a93c40}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1c0e10;--surf:#2a1417;--tx:#fbeeee;--mut:#c9a3a8;--bd:#4a2429;--red:#d9626a;--redd:#a93c40}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.side{position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--side);color:#fff;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow-y:auto;z-index:20;transition:transform .2s}
.logo{width:210px;max-width:100%;margin:0 0 30px 6px;display:block}
.side nav button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;color:#fff;font:inherit;font-size:16px;padding:12px 10px;text-align:left;cursor:pointer;border-radius:8px}
.side nav button:hover{background:rgba(255,255,255,.1)}
.side nav button.on{background:rgba(255,255,255,.18);font-weight:700}
.b{background:#fff;color:var(--side);border-radius:10px;font-size:11px;font-weight:700;padding:1px 7px;margin-left:auto}
.ic{filter:brightness(0) invert(1);display:inline-block;width:1.3em;text-align:center}
.sec{font-weight:700;font-size:16px;margin:28px 0 6px 10px}
.foot{margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.25);font-size:13px;opacity:.9}
.wrap{margin-left:260px}
.hero{position:relative;min-height:270px;color:#fff;background-size:cover;background-position:center 70%;display:flex;flex-direction:column;justify-content:space-between}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.05) 45%,rgba(0,0,0,.6))}
.hero>*{position:relative}
.top{display:flex;align-items:center;gap:16px;padding:18px 22px}
.burger{display:none;background:none;border:0;color:#fff;font-size:28px;line-height:1;cursor:pointer;padding:0}
.tl{font-size:17px}
.out{margin-left:auto;background:rgba(0,0,0,.25);color:#fff;border:2px solid #fff;border-radius:8px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
.ht{padding:0 24px 22px}.ht h1{margin:0;font-size:36px;text-shadow:0 2px 8px rgba(0,0,0,.5)}.ht p{margin:4px 0 0;font-size:16px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.scrim{display:none}
@media (max-width:800px){.side{transform:translateX(-100%)}body.menu .side{transform:none}.wrap{margin-left:0}.burger{display:block}body.menu .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}.ht h1{font-size:28px}}
main{max-width:980px;margin:0 auto;padding:16px}
#crumbs{max-width:980px;margin:0 auto;padding:14px 16px 0;font-size:13px;color:var(--mut)}
#crumbs a{color:var(--red);font-weight:600;text-decoration:none;cursor:pointer}
#crumbs a:hover{text-decoration:underline}
#crumbs span{color:var(--tx);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:14px;position:relative}
.emo{font-size:40px;text-align:center}
.card h3{margin:6px 0 2px;font-size:16px}
.mut{color:var(--mut);font-size:13px}
.price{font-weight:700;color:var(--red);font-size:17px}.price s{color:var(--mut);font-weight:400;font-size:13px;margin-left:6px}
.tag{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;font-weight:700;font-size:12px;padding:2px 8px;border-radius:8px}
button.p,a.p{display:inline-block;background:var(--red);color:#fff;border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
button.p:hover,a.p:hover{background:var(--redd)}
button.s{background:none;border:1.5px solid var(--red);color:var(--red);border-radius:9px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,textarea,select{width:100%;padding:11px 12px;border:1.5px solid var(--mut);border-radius:9px;background:var(--surf);color:var(--tx);font:inherit}
input:focus,textarea:focus,select:focus{outline:2px solid var(--red);outline-offset:1px;border-color:var(--red)}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.8}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:13px}
.note{border-left:4px solid var(--red);padding:10px 12px;background:var(--surf);border-radius:8px;margin-bottom:8px}
.note.new{background:#f6dfe0;color:#2a1215}
.ok{background:var(--surf);border:2px solid var(--red);border-radius:12px;padding:14px;margin-bottom:14px}
.warn{background:#f6dfe0;color:#7a2226;padding:10px;border-radius:8px;margin-bottom:12px}
.line{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--bd)}
h2{margin:4px 0 12px;font-size:18px}
.sect{margin-bottom:22px}
</style></head><body>

<div id="crumbs" aria-label="Breadcrumb"></div>
<main id="app"><p class="mut">Loading…</p></main></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GH=n=>"GH₵"+Number(n||0).toFixed(2);
const S={me:null,db:null,vendors:[],products:[],notes:[],cart:{},tab:"shop",q:"",vf:"",buyer:"",ok:null,err:"",seen:0};
let dirty=false;
try{S.buyer=localStorage.getItem("cm_name")||"";S.seen=+localStorage.getItem("cm_seen")||0;S.cart=JSON.parse(localStorage.getItem("cm_cart")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("cm_cart",JSON.stringify(S.cart));localStorage.setItem("cm_name",S.buyer)}catch(e){}};
const vend=id=>S.vendors.find(v=>v.id===id);
const eff=p=>p.price*(1-(p.discount||0)/100);
const myNotes=()=>S.notes.filter(n=>n.to===S.me||n.to==="all").sort((a,b)=>b.ts-a.ts);
const unread=()=>myNotes().filter(n=>n.ts>S.seen&&n.from!==S.me).length;
const cartCount=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const myV=()=>vend(S.me);

function contact(c,text){
  c=(c||"").trim();
  if(/^\+?[\d\s-]{7,}$/.test(c)){let d=c.replace(/\D/g,"");if(d.startsWith("0"))d="233"+d.slice(1);return"https://wa.me/"+d+"?text="+encodeURIComponent(text||"Hi!")}
  if(/^https?:\/\//i.test(c))return c;return null}
async function notify(to,text){try{await S.db.collection("notifications").add({to,text,ts:Date.now(),from:S.me})}catch(e){S.err="Could not send notification."}}

function render(){
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")&&S.tab!=="shop"){dirty=true;return}
  dirty=false;
  const bd=n=>n?`<span class="b">${n}</span>`:"";
  const tabs=[["shop","🛍️ Shop"],["vendors","🏪 Vendors"],["cart","🛒 Cart"+bd(cartCount())],["notes","🔔 Notifications"+bd(unread())],["mine","🏷️ My Shop"]];
  const btn=([k,l])=>{const i=l.indexOf(" ");return `<button class="${S.tab===k?"on":""}" data-act="tab" data-k="${k}"><span class="ic">${l.slice(0,i)}</span>${l.slice(i)}</button>`};
  $("#nav").innerHTML=tabs.map(btn).join("");
  $("#nav2").innerHTML=btn(["info","ℹ️ How it works"]);
  const L={shop:"Shop",vendors:"Vendors",cart:"Cart",notes:"Notifications",mine:"My Shop",info:"How it works"};
  const cr=[`<a data-act="home">Home</a>`];
  if(S.tab==="shop"&&S.vf)cr.push(`<a data-act="tab" data-k="vendors">Vendors</a>`,`<span>${esc(vend(S.vf)?.name||"Vendor")}</span>`);
  else cr.push(`<span>${L[S.tab]}</span>`);
  $("#crumbs").innerHTML=cr.join(" › ");
  const v={shop:shopV,vendors:vendorsV,cart:cartV,notes:notesV,mine:mineV,info:infoV}[S.tab]();
  $("#app").innerHTML=(S.err?`<div class="warn">${esc(S.err)}</div>`:"")+(S.db?"":`<div class="warn">Sign in to browse and order from vendors.</div>`)+v;
}
function shopV(){
  let ps=S.products.filter(p=>p.stock!==false&&(!S.vf||p.vendor===S.vf)&&(p.name+" "+(vend(p.vendor)?.name||"")).toLowerCase().includes(S.q.toLowerCase()));
  ps.sort((a,b)=>(b.discount||0)-(a.discount||0));
  return `<div class="row" style="margin-bottom:12px"><input id="q" placeholder="Search goods or vendors…" value="${esc(S.q)}" style="flex:1;min-width:180px">${S.vf?`<button class="s" data-act="clearvf">Showing ${esc(vend(S.vf)?.name||"vendor")} ✕</button>`:""}</div>`+
  (ps.length?`<div class="grid">${ps.map(p=>`<div class="card">${p.discount>0?`<span class="tag">-${p.discount}%</span>`:""}<div class="emo">${esc(p.emoji||"🛒")}</div><h3>${esc(p.name)}</h3><div class="mut">by ${esc(vend(p.vendor)?.name||"Vendor")}</div><div class="price" style="margin:6px 0">${GH(eff(p))}${p.discount>0?`<s>${GH(p.price)}</s>`:""}</div><button class="p" data-act="add" data-id="${p.id}">Add to cart</button></div>`).join("")}</div>`:`<p class="mut">No goods yet. Vendors: open <b>My Shop</b> to create your profile and list items.</p>`);
}
function vendorsV(){
  return S.vendors.length?`<div class="grid">${S.vendors.map(v=>{const n=S.products.filter(p=>p.vendor===v.id).length;const h=contact(v.contact,"Hi "+v.name+"! I found you on Ashesi Mart.");
  return `<div class="card"><div class="emo">🏪</div><h3>${esc(v.name)}</h3><div class="mut">${esc(v.cat||"General")} · ${n} item${n==1?"":"s"}</div><p>${esc(v.bio||"")}</p><div class="row"><button class="p" data-act="vf" data-id="${v.id}">View goods</button>${h?`<a class="s" style="text-decoration:none;padding:8px 12px;border:1.5px solid var(--red);border-radius:9px;color:var(--red);font-weight:600" href="${esc(h)}" target="_blank" rel="noopener">Message</a>`:""}</div></div>`}).join("")}</div>`:`<p class="mut">No vendors yet. Be the first: open <b>My Shop</b>.</p>`;
}
function cartV(){
  const ids=Object.keys(S.cart).filter(i=>S.products.find(p=>p.id===i));
  const by={};ids.forEach(i=>{const p=S.products.find(x=>x.id===i);(by[p.vendor]=by[p.vendor]||[]).push(p)});
  let h="";
  if(S.ok){const o=S.ok;h+=`<div class="ok"><b>✅ Order placed with ${esc(o.vname)}!</b><p>Total ${GH(o.total)}. Now text the vendor to agree on payment and pickup/delivery.</p>${o.href?`<a class="p" href="${esc(o.href)}" target="_blank" rel="noopener">Text ${esc(o.vname)} now</a>`:`<span class="mut">This vendor has not added a contact link yet.</span>`} <button class="s" data-act="dismiss">Done</button></div>`}
  if(!ids.length)return h+`<p class="mut">Your cart is empty.</p>`;
  h+=`<label>Your name (so vendors know who ordered)</label><input id="buyer" value="${esc(S.buyer)}" placeholder="e.g. Ama Mensah">`;
  for(const vid in by){const v=vend(vid);const tot=by[vid].reduce((a,p)=>a+eff(p)*S.cart[p.id],0);
    h+=`<div class="sect card" style="margin-top:14px"><h2>${esc(v?.name||"Vendor")}</h2>${by[vid].map(p=>`<div class="line"><span>${esc(p.emoji||"")} ${esc(p.name)} × ${S.cart[p.id]}</span><span>${GH(eff(p)*S.cart[p.id])} <button class="s" data-act="dec" data-id="${p.id}">−</button> <button class="s" data-act="add" data-id="${p.id}">+</button></span></div>`).join("")}<div class="line"><b>Total</b><b class="price">${GH(tot)}</b></div><button class="p" style="margin-top:10px" data-act="order" data-id="${vid}">Place order</button></div>`}
  return h;
}
function infoV(){return `<h2>How Ashesi Mart works</h2><div class="card"><p><b>1. Browse.</b> Find goods from vendors across campus.</p><p><b>2. Order.</b> Add items to your cart and place your order.</p><p><b>3. Text the vendor.</b> We open their WhatsApp, Instagram or Snapchat so you can agree on payment and pickup.</p><p><b>4. Stay updated.</b> Check 🔔 Notifications for discounts and order updates.</p><p class="mut">Selling? Open <b>My Shop</b> to create your vendor profile.</p></div>`}
function notesV(){
  const ns=myNotes();
  return `<h2>Notifications</h2>`+(ns.length?ns.map(n=>`<div class="note ${n.ts>S.seen&&n.from!==S.me?"new":""}">${esc(n.text)}<div class="mut">${new Date(n.ts).toLocaleString()}</div></div>`).join(""):`<p class="mut">Nothing yet. You’ll see discounts, order confirmations and new orders here.</p>`);
}
function mineV(){
  if(!S.db)return"";
  const v=myV();
  let h=`<div class="sect"><h2>${v?"Your vendor profile":"Become a vendor"}</h2><label>Shop name</label><input id="vn" value="${esc(v?.name||"")}" placeholder="e.g. Kofi’s Snacks"><label>Category</label><input id="vc" value="${esc(v?.cat||"")}" placeholder="Food, Clothing, Services…"><label>About your shop</label><textarea id="vb" rows="2">${esc(v?.bio||"")}</textarea><label>Contact: WhatsApp number or Instagram/Snapchat link</label><input id="vl" value="${esc(v?.contact||"")}" placeholder="0244123456 or https://instagram.com/yourshop"><div style="margin-top:12px"><button class="p" data-act="savev">${v?"Update profile":"Create profile"}</button></div></div>`;
  if(v){
    h+=`<div class="sect"><h2>Add an item</h2><div class="row"><input id="pe" style="width:70px" placeholder="🍟" value="🛒"><input id="pn" style="flex:1;min-width:140px" placeholder="Item name"><input id="pp" type="number" min="0" step="0.5" style="width:110px" placeholder="Price GH₵"><input id="pd" type="number" min="0" max="90" style="width:110px" placeholder="Discount %"><button class="p" data-act="addp">Add</button></div></div><div class="sect"><h2>Your items</h2>`;
    const mine=S.products.filter(p=>p.vendor===S.me);
    h+=mine.length?mine.map(p=>`<div class="line"><span>${esc(p.emoji||"")} <b>${esc(p.name)}</b> · ${GH(p.price)} ${p.stock===false?'<span class="mut">(sold out)</span>':""}</span><span class="row"><input id="d${p.id}" type="number" min="0" max="90" value="${p.discount||0}" style="width:76px"><button class="s" data-act="disc" data-id="${p.id}">Set %</button><button class="s" data-act="stock" data-id="${p.id}">${p.stock===false?"Restock":"Sold out"}</button><button class="s" data-act="delp" data-id="${p.id}">Delete</button></span></div>`).join(""):`<p class="mut">No items yet.</p>`;
    h+=`</div>`}
  return h;
}

async function act(el){
  const a=el.dataset.act,id=el.dataset.id,db=S.db;S.err="";
  try{
  if(a==="menu"){document.body.classList.toggle("menu");return}
  else if(a==="tab"){document.body.classList.remove("menu");S.tab=el.dataset.k;if(S.tab!=="shop")S.vf="";if(S.tab==="notes"){S.seen=Date.now();try{localStorage.setItem("cm_seen",S.seen)}catch(e){}setTimeout(()=>{},0)}}
  else if(a==="add"){S.cart[id]=(S.cart[id]||0)+1;save()}
  else if(a==="dec"){S.cart[id]=(S.cart[id]||1)-1;if(S.cart[id]<=0)delete S.cart[id];save()}
  else if(a==="vf"){S.vf=id;S.tab="shop"}
  else if(a==="clearvf")S.vf="";
  else if(a==="home"){S.tab="shop";S.vf=""}
  else if(a==="dismiss")S.ok=null;
  else if(a==="order"&&db){
    S.buyer=($("#buyer")?.value||S.buyer).trim();if(!S.buyer){S.err="Please enter your name first.";return render()}
    const items=Object.keys(S.cart).map(i=>S.products.find(p=>p.id===i)).filter(p=>p&&p.vendor===id);
    const total=items.reduce((a,p)=>a+eff(p)*S.cart[p.id],0),v=vend(id);
    const lines=items.map(p=>`${S.cart[p.id]}× ${p.name}`).join(", ");
    await db.collection("orders").add({buyer:S.me,buyerName:S.buyer,vendor:id,items:lines,total,ts:Date.now()});
    await notify(S.me,`Purchase successful! Order with ${v.name}: ${lines} (${GH(total)}). Text them to confirm payment and delivery.`);
    await notify(id,`🎉 New order from ${S.buyer}: ${lines} (${GH(total)}). They will message you shortly.`);
    items.forEach(p=>delete S.cart[p.id]);save();
    S.ok={vname:v.name,total,href:contact(v.contact,`Hi ${v.name}, it’s ${S.buyer}. I just ordered on Ashesi Mart: ${lines} (${GH(total)}).`)};
  }
  else if(a==="savev"&&db){
    const name=$("#vn").value.trim();if(!name){S.err="Shop name is required.";return render()}
    await db.collection("vendors").doc(S.me).set({name,cat:$("#vc").value.trim(),bio:$("#vb").value.trim(),contact:$("#vl").value.trim(),owner:S.me,ts:Date.now()});
  }
  else if(a==="addp"&&db){
    const name=$("#pn").value.trim(),price=parseFloat($("#pp").value),d=Math.min(90,Math.max(0,parseInt($("#pd").value)||0));
    if(!name||!(price>=0)){S.err="Enter an item name and price.";return render()}
    await db.collection("products").add({vendor:S.me,name,price,discount:d,emoji:$("#pe").value.trim()||"🛒",stock:true,ts:Date.now()});
    if(d>0)await notify("all",`🔥 ${d}% off ${name} at ${myV().name}!`);
  }
  else if(a==="disc"&&db){
    const p=S.products.find(x=>x.id===id),d=Math.min(90,Math.max(0,parseInt($("#d"+id).value)||0));
    await db.collection("products").doc(id).update({discount:d});
    if(d>0&&d!==(p.discount||0))await notify("all",`🔥 ${d}% off ${p.name} at ${myV().name}!`);
  }
  else if(a==="stock"&&db){const p=S.products.find(x=>x.id===id);await db.collection("products").doc(id).update({stock:p.stock===false})}
  else if(a==="delp"&&db){await db.collection("products").doc(id).delete();delete S.cart[id];save()}
  }catch(e){S.err="Something went wrong: "+(e?.message||e?.code||"try again")}
  dirty=false;render();
}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el)act(el)});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;const p=e.target.selectionStart;render();const q=$("#q");if(q){q.focus();q.setSelectionRange(p,p)}}if(e.target.id==="buyer"){S.buyer=e.target.value;save()}});
document.addEventListener("focusout",()=>setTimeout(()=>{if(dirty)render()},150));

(async()=>{
  render();
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user){S.db=null;return render()}
    S.db=db;S.me=await user.id();
    const sub=(c,k,sort)=>db.collection(c).onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));if(sort)S[k].sort(sort);render()},e=>{S.err="Could not load "+c;render()});
    sub("vendors","vendors");sub("products","products",(a,b)=>b.ts-a.ts);sub("notifications","notes");
  }catch(e){S.db=null;render()}
})();
</script></body></html>
